[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mistral-tpu8-hidden-states"
version = "0.1.0"
description = "Eight-device TPU v5e extraction of Mistral-7B hidden states"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "torch==2.9.0",
  "torch_xla[tpu]==2.9.0",
  "transformers==5.13.1",
  "accelerate==1.14.0",
  "safetensors==0.8.0",
  "huggingface_hub==1.24.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
